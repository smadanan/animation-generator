services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    env_file: ./backend/.env
    volumes: ["animation_data:/tmp/chai-animation-data"]
  web:
    image: node:22-alpine
    working_dir: /ui
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/ui
      - frontend_node_modules:/ui/node_modules
    depends_on: [api]
volumes:
  animation_data:
  frontend_node_modules:
