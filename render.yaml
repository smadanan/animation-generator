services:
  - type: web
    name: chai-animation-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: chai-animation-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data/chai-animation-data
      - key: WHISPER_MODEL
        value: base
      - key: CORS_ORIGINS
        value: https://chai-animation-studio.onrender.com

  - type: web
    name: chai-animation-studio
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: chai-animation-api
          property: host
